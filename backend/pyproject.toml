[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zhice-api"
version = "30.0.0"
description = "Zhice AI market intelligence API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.1",
  "uvicorn[standard]>=0.35.0",
  "sqlalchemy[asyncio]>=2.0.43",
  "asyncmy>=0.2.10",
  "aiosqlite>=0.21.0",
  "pydantic-settings>=2.10.1",
  "python-jose[cryptography]>=3.5.0",
  "passlib[argon2]>=1.7.4",
  "python-multipart>=0.0.20",
  "email-validator>=2.2.0",
  "httpx>=0.28.1",
  "apscheduler>=3.11.0",
]

[project.optional-dependencies]
market = ["akshare>=1.17.0"]
dev = [
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
