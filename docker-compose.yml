services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: zhice_ai
      MYSQL_USER: zhice
      MYSQL_PASSWORD: zhice
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ./backend/sql/002_email_verification.sql:/docker-entrypoint-initdb.d/002_email_verification.sql:ro
      - ./backend/sql/003_ai_model_policies.sql:/docker-entrypoint-initdb.d/003_ai_model_policies.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  mysql_data:
